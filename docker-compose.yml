services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sigelab-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Configure la variable MSSQL_SA_PASSWORD en .env.docker}
    ports:
      - "127.0.0.1:1433:1433"
    volumes:
      - sigelab_sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  sigelab_sql_data:
